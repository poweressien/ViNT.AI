name: Android build

# Primary build system for ViNT (see docs/GITHUB_ACTIONS.md).
# Jobs: python-checks | jni-host-verify | android-debug  ->  summary
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"            # AGP 8.5.2 requires JDK 17; Gradle 8.9 runs on 17
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------ 1. Python + static audits (no Android involved)
  python-checks:
    name: Python tests and static audits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Locate project root
        run: bash .github/scripts/locate_project.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependencies
        run: python -m pip install pytest pillow
      - name: pytest
        working-directory: ${{ env.PROJECT_ROOT }}
        run: python -m pytest tests -q
      - name: Offline audit (permissions, networking libraries)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: python tools/audit_android_offline.py android-app
      - name: Brand palette audit
        working-directory: ${{ env.PROJECT_ROOT }}
        run: python tools/audit_brand_palette.py android-app

  # ------------------------------------------------------------------ 2. JNI bridge against pinned llama.cpp on the Linux host
  jni-host-verify:
    name: JNI + engine host check (pinned llama.cpp, host CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Locate project root
        run: bash .github/scripts/locate_project.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools (ninja, gguf, numpy, Kotlin 2.0.20 compiler)
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          python -m pip install gguf numpy
          curl -fsSL -o /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.20/kotlin-compiler-2.0.20.zip
          echo "5f5d2a8ad6a718a002acd0775b67a9e27035872fdbd4b0791e3cb3ea00095931  /tmp/kotlinc.zip" | sha256sum -c -
          sudo unzip -q /tmp/kotlinc.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Fetch llama.cpp at the pinned commit
        run: bash .github/scripts/fetch_llama_cpp.sh
      - name: Run host-verify
        working-directory: ${{ env.PROJECT_ROOT }}
        run: bash tools/host-verify/run_host_verify.sh 2>&1 | tee "$RUNNER_TEMP/host-verify.log"
      - name: Upload host-verify log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ViNT-jni-host-verify-log
          path: ${{ runner.temp }}/host-verify.log
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------ 3. The real thing: Gradle + NDK + CMake -> debug APK
  android-debug:
    name: Build debug APK (Gradle, NDK, CMake)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate project root and read pinned toolchain versions
        run: bash .github/scripts/locate_project.sh --toolchain

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install SDK platform, build-tools, NDK and CMake (versions read from the Gradle files)
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-${COMPILE_SDK}" "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # --- native dependency: llama.cpp at the exact commit in docs/LLAMA_CPP_PIN.txt (never "latest") ---
      - name: Cache llama.cpp checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PROJECT_ROOT }}/android-app/third_party/llama.cpp
          key: llama-cpp-${{ hashFiles(format('{0}docs/LLAMA_CPP_PIN.txt', env.PROJECT_PREFIX)) }}
      - name: Fetch llama.cpp at the pinned commit
        run: bash .github/scripts/fetch_llama_cpp.sh

      # --- voice runtime: sherpa-onnx AAR, SHA-256 verified by tools/fetch_voice_models.py (speech MODELS are not fetched) ---
      - name: Cache sherpa-onnx AAR
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PROJECT_ROOT }}/android-app/app/libs
          key: sherpa-aar-${{ hashFiles(format('{0}tools/voice_models.json', env.PROJECT_PREFIX)) }}
      - name: Fetch sherpa-onnx runtime AAR (hash-verified)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: python tools/fetch_voice_models.py --runtime

      - name: Set up Gradle (wrapper validation, open-source cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Gradle configuration check
        working-directory: ${{ env.PROJECT_ROOT }}/android-app
        run: ./gradlew --version && ./gradlew projects --console=plain

      - name: Build debug APK (Kotlin + Compose + native arm64-v8a) and run unit tests
        working-directory: ${{ env.PROJECT_ROOT }}/android-app
        timeout-minutes: 60
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:testDebugUnitTest \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Verify APK (exists, valid zip, application ID, native libs, JNI symbols, no model weights)
        run: bash .github/scripts/verify_apk.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ViNT-debug-apk
          path: ${{ runner.temp }}/apk-out/*
          if-no-files-found: error
          retention-days: 30

      - name: Show Gradle failure excerpt
        if: failure()
        continue-on-error: true
        run: bash .github/scripts/extract_errors.sh "$RUNNER_TEMP/gradle-build.log"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ViNT-build-diagnostics
          path: |
            ${{ runner.temp }}/gradle-build.log
            ${{ env.PROJECT_ROOT }}/android-app/app/build/reports/
            ${{ env.PROJECT_ROOT }}/android-app/app/.cxx/
            ${{ env.PROJECT_ROOT }}/android-app/build/reports/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------ 4. Honest summary
  summary:
    name: Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [python-checks, jni-host-verify, android-debug]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write job summary (reporting only, never fails)
        continue-on-error: true
        env:
          R_PY: ${{ needs.python-checks.result }}
          R_JNI: ${{ needs.jni-host-verify.result }}
          R_APK: ${{ needs.android-debug.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/write_summary.sh
      - name: Gate (fails only if a required job did not succeed)
        env:
          R_PY: ${{ needs.python-checks.result }}
          R_JNI: ${{ needs.jni-host-verify.result }}
          R_APK: ${{ needs.android-debug.result }}
        run: bash .github/scripts/gate_summary.sh
