org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official
# Single source of truth for the Android toolchain. build.gradle.kts reads these, and .github/workflows/android-build.yml installs exactly these SDK packages.
# 34.0.0 and 26.1.10909125 are the defaults of AGP 8.5.2 (the pinned plugin version), written down so CI and local builds cannot drift apart.
vint.compileSdk=34
vint.buildTools=34.0.0
vint.ndk=26.1.10909125
vint.cmake=3.22.1
